<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <title>VDL Explorer</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.jsdelivr.net/gh/varavelio/vdl@v0.5.0-alpha.5/assets/svg/icon.svg"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.jsdelivr.net/gh/varavelio/vdl@v0.5.0-alpha.5/assets/favicon.ico"
    />

    <!-- Varavel UI Stuff -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      rel="stylesheet"
      href="https://fonts.bunny.net/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/@varavel/ui@0/static/theme-init.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@varavel/ui@0/static/layout-app-init.min.js"></script>

    <script>
    // These variables are replaced by the plugin at build time to inject
    // the configuration into the explorer.
    window.__vdl_http_rpc_base_url = "https://<baseURL>";
    window.__vdl_ir = {};
    </script>

    <script>
    // Redirect tree-sitter WASM requests to the CDN. curlconverter loads
    // from the jsDelivr ESM bundle at runtime and fetches these files
    // relative to the site root, which does not exist in the single-file
    // build, so they are served from jsDelivr instead.
    const __mpOriginalFetch = globalThis.fetch;
    const __mpWasmCdn = {
      "tree-sitter.wasm": "https://cdn.jsdelivr.net/npm/web-tree-sitter@0.24.7/tree-sitter.wasm",
      "tree-sitter-bash.wasm": "https://cdn.jsdelivr.net/npm/curlconverter@4.12.0/dist/tree-sitter-bash.wasm",
    };
    function __mpResolveWasm(url) {
      const file = url.split("?")[0].split("#")[0].split("/").pop();
      return __mpWasmCdn[file] || null;
    }
    globalThis.fetch = function (resource, options) {
      if (typeof resource === "string") {
        const redirect = __mpResolveWasm(resource);
        if (redirect) resource = redirect;
      } else if (resource instanceof Request) {
        const redirect = __mpResolveWasm(resource.url);
        if (redirect) resource = new Request(redirect, resource);
      }
      return __mpOriginalFetch.call(this, resource, options);
    };
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
